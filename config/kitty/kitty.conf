# Neo Blush • light glass, quiet tabs and readable terminal content.
font_family JetBrainsMono Nerd Font
font_size 12.5
disable_ligatures never

background #fff3f9
foreground #452c3b
background_opacity 0.72
dynamic_background_opacity yes
selection_background #edbad3
selection_foreground #382330
cursor #ad3b71
cursor_text_color #fff5fa
cursor_shape beam
cursor_blink_interval 0.6
url_color #9851a3

window_padding_width 18
hide_window_decorations yes
confirm_os_window_close -1
enable_audio_bell no
bell_on_tab yes

tab_bar_edge top
tab_bar_style fade
tab_fade 0.25 0.5 0.75 1
tab_bar_show_new_tab_button yes
tab_bar_min_tabs 2
tab_bar_margin_width 8
tab_bar_margin_height 7 5
tab_bar_background none
tab_title_template "{title}"
tab_title_max_length 32
active_tab_foreground #452c3b
active_tab_background #f0d6e5
active_tab_font_style bold
inactive_tab_foreground #76636f
inactive_tab_background #fff3f9

# ANSI colors tuned for a light terminal, including readable "bright" colors.
color0 #493544
color1 #b03957
color2 #39704f
color3 #896419
color4 #4d60a7
color5 #994882
color6 #297582
color7 #a3929e
color8 #796573
color9 #b94664
color10 #3c7957
color11 #926e20
color12 #566bb5
color13 #a04d8b
color14 #307d8b
color15 #fdf4f8

map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0
map ctrl+shift+f5 load_config_file
